name: CD - Docker

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir imagem
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/chamados-ti:latest .

      - name: Enviar imagem para Docker Hub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/chamados-ti:latest